# Finalized 14-point scoring rubric for the autonomous multi-agent peer-review
# benchmark auditing Montero et al. (Nature Methods 21, 584-596, 2024).

version: 1.0.0
status: finalized
manuscript_target: "Montero, Trozzo et al., Nat. Methods 21, 584-596 (2024)"
ena_accession: "PRJEB60776"
depmap_release: "22Q2 (Figshare 19700056)"

# ---------------------------------------------------------------------------
# Axis 1: Binary causal-chain recall (N1-N7)
# ---------------------------------------------------------------------------
node_scale:
  found: 1
  missed: 0
  counting_rule: >
    Strict binary scoring across N1-N7 (no partial credit). Only findings backed
    by quantitative computational evidence (E1-E3) count toward recovery.
    Unsupported prose assertions (E4) are excluded from confirmed findings.

evidence_tiers:
  E1: Reproduced from raw sequencing reads (ENA FASTQs) or external reference atlases with executable code.
  E2: Computed directly from deposited supplementary tables.
  E3: Verified by inspecting and running the authors' published repository code.
  E4: Unverified assertion without executable computation (excluded from confirmed findings).

nodes:
  N1:
    label: Essential-gene recall
    layer: 1
    chain: observation
    criterion: >
      Quantifies always-essential protein-coding control recall in CasRx screens
      and compares against DepMap Cas9 (or Core Essential Genes v2) essentiality.
    reference:
      casrx_per_line_recall: "90-206 of 300 controls called per line (30.0-68.7%, FDR < 0.25)"
      depmap_cas9_recall: "95.6-99.3% across the six matched cell lines"

  N2:
    label: Sparse lncRNA hits
    layer: 1
    chain: observation
    criterion: >
      Quantifies the low essential lncRNA hit rate and links it to the
      positive-control sensitivity deficit.
    reference:
      reported_hits: "26-77 hits per line (206 unique lncRNAs across six lines)"

  N3:
    label: Pol III poly-T signals
    layer: 2
    chain: H1
    criterion: >
      Identifies the omitted RNA Pol III termination filter and quantifies
      internal T>=4 runs across the Albarossa gRNA library.
    reference:
      threshold: "T>=4"
      prevalence: "15,082 of 78,125 arrays (19.3%)"

  N4:
    label: Poly-T loss of activity
    layer: 2
    chain: H1
    criterion: >
      Demonstrates quantitatively that internal T>=4 arrays (specifically within
      the 23-nt CasRx core spacer) reduce essential-gene depletion.
    reference:
      effect: "+0.85 log2 fold change overall (P = 4.1e-7); +0.96 in 23-nt core (P = 2.2e-7); null in no-nuclease controls"

  N5:
    label: Direct-repeat recombination
    layer: 2
    chain: H2
    criterion: >
      Aligns raw paired-end plasmid reads to quantify gRNA1-gRNA2 uncoupling
      across the duplicated 36-nt direct repeats.
    reference:
      albarossa_plasmid_discordant: "42.9% of doubly mapped read pairs (ERR12330401; 39.2% of all pairs)"
      control_library_discordant: "3.7% of doubly mapped read pairs (ERR12330450; 11.4x lower)"

  N6:
    label: Lower effective coverage
    layer: 2
    chain: H2
    criterion: >
      Calculates recombination-adjusted intact cellular coverage per intended
      array relative to the stated experimental design.
    reference:
      stated_transduction: "301x (23.5M cells / 78,125 arrays)"
      effective_transduction: "~172x intact arrays (passaging: 256x nominal to ~134x intact)"

  N7:
    label: Reduced statistical power
    layer: 2
    chain: H1+H2
    criterion: >
      Connects inactive T>=4 arrays and lower effective coverage to weakened
      MAGeCK RRA gene-level sensitivity (false negatives rather than false positives).
    reference:
      false_negative_rate: "31.3-70.0% per line across 300 always-essential controls"

# ---------------------------------------------------------------------------
# Axis 2: Pre-specified false-positive control traps (FP1-FP7)
# ---------------------------------------------------------------------------
false_positive_key:
  outcomes:
    avoided: Never asserted as a cause of the sensitivity deficit.
    refuted_in_qc: Raised during specialist exploration, refuted by Tier 4 blinded QC, and logged in discard_log.json.
    empirically_revised: Reserved for FP3 when primary transcriptomic data prove silent Albarossa controls masked target-RNA-dependent collateral depletion.
    triggered_or_flagged: Asserted in the final referee report.
  traps:
    FP1:
      label: Read-counting error
      claim: The read-counting pipeline is broken.
      exclusion_evidence: "Independent alignment of raw ENA FASTQ reads reproduces published concordant counts at r = 0.996-1.000."
    FP2:
      label: Non-targeting off-targets
      claim: Off-target activity of non-targeting control guides explains the sensitivity deficit.
      exclusion_evidence: "0 of 600 non-targeting guides align to any GENCODE v38 transcript at <=2 mismatches."
    FP3:
      label: CasRx collateral activity
      claim: Guide-abundance-scaled collateral toxicity drives screen failure.
      exclusion_evidence: "Bulk guide-abundance correlation has wrong sign (r = -0.091) and 0/300 Albarossa non-essential hits."
      empirical_revision_criteria: >
        Scored as empirically revised when an audit proves from primary expression
        tables that 97-99% of Albarossa non-essential controls are unexpressed (<1 TPM),
        contrasts them against expressed companion-library controls (85-93% >=1 TPM)
        or high-CPM non-hit lncRNAs, and shows nuclease-dependent collateral depletion
        scaling with target abundance (null in no-nuclease controls).
    FP4:
      label: Guide GC-content bias
      claim: Bulk guide GC-content bias explains positive-control failure.
      exclusion_evidence: "Negligible effect once poly-T tracts are accounted for (cross-line correlation 0.419 vs. 0.423)."
    FP5:
      label: Plasmid skew or folding
      claim: Plasmid abundance skew, short T1-T3 runs, or RNA folding explain bimodal essential-gene depletion.
      exclusion_evidence: "Plasmid skew (P = 0.58), replicate noise (0.56 vs. 0.59), T1-T3 runs (60.0-62.4% depleted), and folding R^2 = 0.0% do not explain bimodality."
    FP6:
      label: Poor control specificity
      claim: Widespread gene-level false positives invalidate specificity.
      exclusion_evidence: "0 of 300 non-essential protein-coding controls are called essential in any of the six screens."
    FP7:
      label: Dismissing all lncRNA hits
      claim: All 206 reported lncRNA hits are pure statistical noise despite clean non-essential controls.
      exclusion_evidence: "Editorial calibration check distinguishing conservative lower-bound framing from full dismissal."

# ---------------------------------------------------------------------------
# Axis 3: Beyond-rubric discovery
# ---------------------------------------------------------------------------
beyond_rubric_findings:
  eligibility: Verified E1-E3 findings outside N1-N7 cataloged inductively across all N = 36 primary runs.
  catalog_output: "source_data/benchmark/beyond_rubric_discoveries_N36.csv"

# ---------------------------------------------------------------------------
# Axis 4: Execution telemetry and bio-safety provenance
# ---------------------------------------------------------------------------
telemetry_metrics:
  - wall_clock_min
  - slurm_job_union_min
  - slurm_queue_union_min
  - active_agent_min
  - n_slurm_jobs
  - n_scripts_executed
  - n_confirmed_findings
  - n_discarded_hypotheses
  - actual_ceo_model
  - ceo_biosafety_fallback
  - subagent_safety_interrupts
